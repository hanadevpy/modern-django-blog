{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Enter New Password{% endblock title %}

{% block content %}
    <div class="conteiner">
        <div class="col-6">
            <h1>Set a new password</h1>
            <form  method="post">
                {% csrf_token %}
                {{ form | crispy }}
                <br>
                <input type="submit" class="btn btn-success" value="Change my password">
                </br>
            </form>
        </div>    
    </div>

{% endblock content %}
